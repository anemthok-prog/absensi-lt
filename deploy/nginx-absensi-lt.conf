# Nginx reverse proxy untuk Absensi LT (produksi)
# Letakkan di: /etc/nginx/sites-available/absensi-lt
# lalu: ln -s /etc/nginx/sites-available/absensi-lt /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Ganti SERVER_DOMAIN dengan domain/subdomain kamu.

server {
    listen 80;
    server_name SERVER_DOMAIN;

    # Redirect HTTP -> HTTPS (setelah certbot aktif)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SERVER_DOMAIN;

    # SSL (generate: sudo certbot --nginx -d SERVER_DOMAIN)
    ssl_certificate     /etc/letsencrypt/live/SERVER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend React (build). Ganti path ke lokasi client/dist di server.
    root /var/www/absensi-lt/client/dist;
    index index.html;

    # Laravel-style: fallback ke index.html untuk SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Express
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads -> Express (foto)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    client_max_body_size 12M; # uiitik upload foto (MAX_FILE_SIZE)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
