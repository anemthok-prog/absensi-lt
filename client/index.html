<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <link rel="icon" href="/src/assets/favicon.png" type="image/png">
  <title>Absensi — MTsN 1 Kebumen</title>
  <script>
    // Anti-flash: terapkan tema sebelum render
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html[data-theme="light"] { background: #f4f7f5; }
    html[data-theme="dark"] { background: #0d0f12; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #root { min-height: 100vh; }

    html[data-theme="light"] ::-webkit-scrollbar { width: 8px; height: 8px; }
    html[data-theme="light"] ::-webkit-scrollbar-track { background: #eef2ef; }
    html[data-theme="light"] ::-webkit-scrollbar-thumb { background: #c4d2c8; border-radius: 4px; }
    html[data-theme="dark"] ::-webkit-scrollbar { width: 8px; height: 8px; }
    html[data-theme="dark"] ::-webkit-scrollbar-track { background: #0d1410; }
    html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #26302a; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
